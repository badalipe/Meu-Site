<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartaz Fácil - Leitor por Câmera</title>
    <!-- Tailwind CSS para o design moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Biblioteca de Leitura de Código de Barras via Câmera -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        @media print {
            body { background-color: white !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            body * { visibility: hidden; }
            #cartaz-preview, #cartaz-preview * { visibility: visible; }
            #cartaz-preview {
                position: fixed; left: 0; top: 0; width: 100vw !important; height: 100vh !important;
                margin: 0 !important; border: none !important; box-shadow: none !important;
                background-color: #facc15 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important;
            }
        }
        .formato-a4-retrato { width: 450px; height: 636px; }
        .formato-a5-retrato { width: 350px; height: 495px; }
        .formato-a6-paisagem { width: 450px; height: 318px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- TOPO / HEADER IDÊNTICO AO ORIGINAL -->
    <header class="bg-blue-600 border-b border-blue-700 p-4 shadow-md">
        <div class="max-w-5xl mx-auto flex justify-between items-center text-white">
            <h1 class="text-base md:text-lg font-bold tracking-wider flex items-center gap-2">
                🏷️ Cartaz Fácil <span class="text-xs bg-blue-800 px-2 py-0.5 rounded">Mobile Scanner</span>
            </h1>
            <div class="text-xs bg-blue-700 px-3 py-1 rounded-full font-medium">
                Usuário: rmarket07
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 md:p-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <!-- PAINEL DE CONTROLE E BUSCA -->
        <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg flex flex-col gap-4">
            <h2 class="text-sm font-bold text-white border-b border-slate-700 pb-2 uppercase tracking-wide flex items-center gap-2">
                🛒 Criação e Leitura de Cartazes
            </h2>
            
            <!-- Filial -->
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Selecione a Filial:</label>
                <select class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg text-white text-sm focus:outline-none">
                    <option>PARATY 2</option>
                </select>
            </div>

            <!-- BOTÃO MÁGICO DE ESCANEAR COM A CÂMERA -->
            <div class="bg-blue-950/60 p-3 rounded-lg border border-blue-800/60 flex flex-col gap-2">
                <label class="block text-xs font-bold text-blue-300 uppercase">Leitor Rápido (Câmera do Celular)</label>
                <button onclick="abrirLeitorCamera()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-4 rounded-lg shadow transition flex items-center justify-center gap-2 text-sm cursor-pointer">
                    📷 Abrir Câmera para Esccanear Código de Barras
                </button>
                <!-- Área onde a câmera vai aparecer quando ativada -->
                <div id="reader" style="width: 100%; display: none;" class="mt-2 rounded overflow-hidden border border-slate-600"></div>
            </div>

            <!-- Campo de Busca Manual ou preenchido pelo Scanner -->
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1">1 - Insira código do produto ou descrição</label>
                <div class="flex gap-2">
                    <input type="text" id="input-busca" placeholder="Escaneie ou digite o código..." 
                        class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg text-white text-sm focus:outline-none focus:border-blue-500">
                    <button onclick="realizarBusca()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2 rounded-lg text-sm transition">
                        Pesquisar
                    </button>
                </div>
            </div>

            <!-- Lista de Produtos Encontrados -->
            <div id="resultado-busca" class="hidden flex flex-col gap-1 bg-slate-900 p-2 rounded-lg border border-slate-700 max-h-36 overflow-y-auto">
                <div onclick="selecionarProduto('REFRI FANTA PET 2L LARANJA', '9,39', '7894900031515')" 
                     class="bg-emerald-900/60 hover:bg-emerald-800 border border-emerald-600 p-2 rounded cursor-pointer text-sm flex justify-between items-center transition">
                    <span class="font-bold text-emerald-300">Cód: 7894900031515</span>
                    <span class="text-white text-right">REFRI FANTA PET 2L LARANJA</span>
                </div>
            </div>

            <!-- Dados de Balizamento (Campanha e Formato) -->
            <div class="border-t border-slate-700 pt-3 flex flex-col gap-3">
                <span class="text-xs font-bold text-slate-400 uppercase">📝 Dados Balizamento</span>
                
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">4 - Selecione a Campanha:</label>
                    <select id="select-campanha" class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg text-white text-sm">
                        <option value="OFERTA!">OFERTA</option>
                        <option value="SUPER OFERTA!">SUPER OFERTA</option>
                        <option value="LIQUIDAÇÃO!">LIQUIDAÇÃO</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">5 - Selecione Formato / Modelo:</label>
                    <select id="select-formato" onchange="mudarFormato()" class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg text-white text-sm">
                        <option value="formato-a4-retrato">A4 Retrato (Grande)</option>
                        <option value="formato-a5-retrato">A5 Retrato (Médio)</option>
                        <option value="formato-a6-paisagem">A6 Paisagem (Pequeno)</option>
                    </select>
                </div>
            </div>

            <button onclick="window.print()" class="mt-2 w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 px-4 rounded-lg shadow transition flex items-center justify-center gap-2 cursor-pointer">
                🖨️ Imprimir Cartaz Agora
            </button>
        </div>

        <!-- PRÉ-VISUALIZAÇÃO DO CARTAZ (ESTILO CLÁSSICO DE MERCADO) -->
        <div class="flex flex-col items-center justify-center bg-slate-950 p-6 rounded-xl border border-slate-800 shadow-inner overflow-auto">
            <span class="text-xs font-semibold text-slate-500 uppercase tracking-widest mb-3">Pré-visualização do Cartaz</span>
            
            <div id="cartaz-preview" class="formato-a4-retrato bg-yellow-300 text-red-700 font-black flex flex-col justify-between p-6 shadow-2xl relative transition-all duration-300" 
                 style="border: 6px solid #dc2626;">
                
                <!-- Faixa Superior -->
                <div id="cartaz-titulo-faixa" class="text-center bg-red-600 text-yellow-300 py-2 rounded uppercase tracking-wider text-xl shadow-md">
                    OFERTA!
                </div>

                <!-- Nome do Produto -->
                <div id="cartaz-nome" class="text-center text-zinc-900 text-2xl md:text-3xl font-black uppercase leading-tight my-auto px-2">
                    REFRI FANTA PET 2L LARANJA
                </div>

                <!-- Preço -->
                <div class="text-center border-t-4 border-dashed border-red-600/40 pt-3">
                    <div class="flex items-start justify-center text-red-600 leading-none">
                        <span class="text-3xl font-bold mt-1 mr-1">R$</span>
                        <span id="cartaz-preco" class="text-7xl md:text-8xl font-black tracking-tighter">9,39</span>
                    </div>
                </div>

                <!-- Rodapé -->
                <div class="flex justify-between items-end text-xs font-bold text-zinc-800 border-t-2 border-red-600/30 pt-2">
                    <span id="cartaz-codigo">Cód: 7894900031515</span>
                    <span class="text-blue-700 font-bold">Cartaz Fácil Clone</span>
                </div>
            </div>
        </div>

    </main>

    <!-- SCRIPTS DE CONTROLE E CÂMERA -->
    <script>
        // Base de dados simulada para teste (você pode expandir ou ligar a um .json)
        const baseProdutos = {
            "7894900031515": { nome: "REFRI FANTA PET 2L LARANJA", preco: "9,39" },
            "7891020304050": { nome: "ARROZ TIPO 1 5KG", preco: "24,90" },
            "7891001122334": { nome: "FEIJÃO CARIOCA 1KG", preco: "7,89" }
        };

        const inputBusca = document.getElementById('input-busca');
        const resultadoBusca = document.getElementById('resultado-busca');
        const selectCampanha = document.getElementById('select-campanha');
        const selectFormato = document.getElementById('select-formato');
        const cartazPreview = document.getElementById('cartaz-preview');

        // Função de busca manual
        function realizarBusca() {
            const termo = inputBusca.value.trim();
            const produto = baseProdutos[termo];

            if (produto || termo !== "") {
                resultadoBusca.classList.remove('hidden');
                if(produto) {
                    resultadoBusca.innerHTML = `
                        <div onclick="selecionarProduto('${produto.nome}', '${produto.preco}', '${termo}')" 
                             class="bg-emerald-900/60 hover:bg-emerald-800 border border-emerald-600 p-2 rounded cursor-pointer text-sm flex justify-between items-center transition">
                            <span class="font-bold text-emerald-300">Cód: ${termo}</span>
                            <span class="text-white text-right">${produto.nome}</span>
                        </div>
                    `;
                }
            } else {
                alert("Digite um código válido.");
            }
        }

        inputBusca.addEventListener('keypress', function(e) {
            if(e.key === 'Enter') { realizarBusca(); }
        });

        // Selecionar o produto da lista e atualizar o cartaz
        function selecionarProduto(nome, preco, codigo) {
            document.getElementById('cartaz-nome').innerText = nome;
            document.getElementById('cartaz-preco').innerText = preco;
            document.getElementById('cartaz-codigo').innerText = 'Cód: ' + codigo;
            resultadoBusca.classList.add('hidden');
            inputBusca.value = '';
        }

        // ATIVAR A CÂMERA PARA ESCANEAR CÓDIGO DE BARRAS
        function abrirLeitorCamera() {
            const readerDiv = document.getElementById('reader');
            readerDiv.style.display = 'block';

            const html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" }, // Usa a câmera traseira do celular
                {
                    fps: 10,    // Quadros por segundo
                    qrbox: { width: 250, height: 100 } // Formato de leitura para código de barras
                },
                (decodedText, decodedResult) => {
                    // Sucesso na leitura do código de barras!
                    inputBusca.value = decodedText;
                    html5QrCode.stop().then(() => {
                        readerDiv.style.display = 'none';
                        realizarBusca(); // Busca automática na base
                    }).catch(err => { console.error("Erro ao desligar câmera", err); });
                },
                (errorMessage) => {
                    // Erros de leitura quadro a quadro são ignorados para não poluir a tela
                }
            ).catch(err => {
                alert("Não foi possível acessar a câmera do celular. Verifique as permissões.");
                readerDiv.style.display = 'none';
            });
        }

        // Alterar texto da campanha
        selectCampanha.addEventListener('change', function() {
            document.getElementById('cartaz-titulo-faixa').innerText = this.value;
        });

        // Mudar formato visual (A4, A5, A6)
        function mudarFormato() {
            cartazPreview.className = cartazPreview.className.replace(/formato-\S+/g, '');
            cartazPreview.classList.add(selectFormato.value);
            cartazPreview.className += " bg-yellow-300 text-red-700 font-black flex flex-col justify-between p-6 shadow-2xl relative transition-all duration-300";
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coletor de Saneamento</title>
  <!-- Biblioteca leve para leitura de Código de Barras -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; text-align: center; background: #f4f4f9; }
    .btn-saneamento { background: #007bff; color: white; border: none; padding: 15px 25px; font-size: 18px; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 15px; }
    .btn-enviar { background: #28a745; color: white; border: none; padding: 15px 25px; font-size: 18px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 15px; }
    #reader { width: 100%; max-width: 400px; margin: 0 auto; display: none; }
    ul { text-align: left; background: white; padding: 15px; border-radius: 8px; list-style: none; }
    li { padding: 8px 0; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>

  <h2>Coletor Rápido de Produtos</h2>

  <!-- Botão principal de Saneamento -->
  <button class="btn-saneamento" onclick="iniciarLeitor()">🧼 Coletar Saneamento (Câmera)</button>

  <!-- Janela de vídeo da Câmera -->
  <div id="reader"></div>

  <h3>Produtos Lidos:</h3>
  <ul id="lista-produtos"></ul>

  <!-- Botão para enviar à API do Cartaz Fácil -->
  <button class="btn-enviar" onclick="enviarParaCartazFacil()">🚀 Enviar para o Cartaz Fácil</button>

  <script>
    const token = "SEU_TOKEN_AQUI"; // Insira seu token da API aqui
    const apiURL = `https://apicartazfacil.com/public/api/importacao/daily?validate=1&token=${token}`;
    
    let produtosColetados = [];
    let html5QrcodeScanner;

    function iniciarLeitor() {
      document.getElementById('reader').style.display = 'block';
      
      html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 150} });
      html5QrcodeScanner.render(onScanSuccess);
    }

    function onScanSuccess(decodedText, decodedResult) {
      // Evita duplicados sequenciais
      if (!produtosColetados.some(p => p.codigo === decodedText)) {
        const novoProduto = {
          codigo: decodedText,
          departamento: "SANEAMENTO",
          sessao: "LIMPEZA"
        };
        
        produtosColetados.push(novoProduto);
        
        // Adiciona na lista visual da tela
        const lista = document.getElementById('lista-produtos');
        const item = document.createElement('li');
        item.innerText = `📦 Código: ${decodedText} - (SANEAMENTO)`;
        lista.appendChild(item);
        
        // Toca um bipe de confirmação
        navigator.vibrate?.(200);
      }
    }

    async function enviarParaCartazFacil() {
      if (produtosColetados.length === 0) {
        alert("Nenhum produto lido ainda!");
        return;
      }

      try {
        const response = await fetch(apiURL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(produtosColetados)
        });

        if (response.ok) {
          alert("Produtos enviados com sucesso!");
          produtosColetados = [];
          document.getElementById('lista-produtos').innerHTML = "";
          if (html5QrcodeScanner) html5QrcodeScanner.clear();
          document.getElementById('reader').style.display = 'none';
        } else {
          alert("Erro ao enviar produtos para a API.");
        }
      } catch (error) {
        alert("Erro de conexão com o servidor.");
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coletor Direto - Saneamento</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 16px; margin: 0; background: #f4f6f8; color: #333; }
    h2 { margin-top: 0; text-align: center; font-size: 20px; color: #1a1a1a; }
    
    .card { background: #ffffff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px; }
    
    .btn { width: 100%; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-enviar { background: #28a745; color: #ffffff; font-size: 18px; margin-top: 16px; }
    
    /* Container fixo para a Câmera */
    #reader { width: 100%; max-width: 400px; margin: 0 auto 16px auto; border-radius: 8px; overflow: hidden; background: #000; min-height: 250px; }
    
    .manual-box { display: flex; gap: 8px; margin-top: 8px; }
    .manual-input { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; outline: none; }
    .manual-input:focus { border-color: #0066cc; }
    .btn-add { background: #17a2b8; color: white; border: none; padding: 12px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    
    ul { text-align: left; background: #ffffff; padding: 12px 16px; border-radius: 8px; list-style: none; margin: 0; max-height: 200px; overflow-y: auto; border: 1px solid #e9ecef; }
    li { padding: 10px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    li:last-child { border-bottom: none; }
    .btn-remove { background: #ff4d4f; color: white; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 12px; }
  </style>
</head>
<body>

  <h2>🧼 Leitor Direto: Saneamento</h2>

  <div class="card">
    <div id="reader"></div>

    <label style="font-size: 13px; font-weight: bold; color: #555;">Digitação Manual (se necessário):</label>
    <div class="manual-box">
      <input type="number" id="codigoManual" class="manual-input" placeholder="Ex: 7891234567890" inputmode="numeric" onkeypress="verificarEnter(event)">
      <button class="btn-add" onclick="adicionarManual()">+ Add</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0; font-size: 16px;">Produtos Lidos (<span id="qtd-total">0</span>):</h3>
    <ul id="lista-produtos">
      <li style="color: #888; text-align: center; justify-content: center;">Aponta a câmera para o código de barras...</li>
    </ul>

    <button class="btn btn-enviar" onclick="enviarParaCartazFacil()">🚀 Enviar para Cartaz Fácil</button>
  </div>

  <script>
    // Apontado para a URL do seu Worker no Cloudflare
    const apiURL = "https://flat-dawn-6511.clientetrabalho2018.workers.dev/";
    
    let produtosColetados = [];
    let html5QrCode;

    // Inicia a câmera TRASEIRA automaticamente assim que abre a página
    window.addEventListener("DOMContentLoaded", () => {
      iniciarCameraTraseira();
    });

    function iniciarCameraTraseira() {
      html5QrCode = new Html5Qrcode("reader");

      const config = { 
        fps: 15, 
        qrbox: { width: 280, height: 160 },
        experimentalFeatures: { useBarCodeDetectorIfSupported: true }
      };

      // O parâmetro facingMode: "environment" força a abertura da Câmera Traseira
      html5QrCode.start(
        { facingMode: "environment" }, 
        config, 
        onScanSuccess
      ).catch(err => {
        console.error("Erro ao iniciar câmera traseira:", err);
      });
    }

    // Ação ao ler o código com sucesso
    function onScanSuccess(decodedText) {
      adicionarProduto(decodedText);
      navigator.vibrate?.(120); // Vibração curta de confirmação
    }

    // Adiciona digitado manualmente
    function adicionarManual() {
      const input = document.getElementById('codigoManual');
      const codigo = input.value.trim();

      if (!codigo) return;

      adicionarProduto(codigo);
      input.value = "";
      input.focus();
    }

    function verificarEnter(event) {
      if (event.key === "Enter") {
        adicionarManual();
      }
    }

    // Regra de inserção do produto na lista
    function adicionarProduto(codigo) {
      if (produtosColetados.some(p => p.codigo === codigo)) {
        return; // Evita ler repetidamente o mesmo item em sequência
      }

      const novoProduto = {
        codigo: codigo,
        departamento: "SANEAMENTO",
        sessao: "LIMPEZA"
      };

      produtosColetados.push(novoProduto);
      atualizarListaVisual();
    }

    function removerProduto(index) {
      produtosColetados.splice(index, 1);
      atualizarListaVisual();
    }

    function atualizarListaVisual() {
      const lista = document.getElementById('lista-produtos');
      const contador = document.getElementById('qtd-total');
      
      contador.innerText = produtosColetados.length;
      lista.innerHTML = "";

      if (produtosColetados.length === 0) {
        lista.innerHTML = '<li style="color: #888; text-align: center; justify-content: center;">Aponta a câmera para o código de barras...</li>';
        return;
      }

      produtosColetados.forEach((prod, index) => {
        const item = document.createElement('li');
        item.innerHTML = `
          <span>📦 <b>${prod.codigo}</b> <small style="color:#666;">(SANEAMENTO)</small></span>
          <button class="btn-remove" onclick="removerProduto(${index})">✕</button>
        `;
        lista.appendChild(item);
      });
    }

    // Envio para o Cloudflare Worker
    async function enviarParaCartazFacil() {
      if (produtosColetados.length === 0) {
        alert("Nenhum produto lido na lista!");
        return;
      }

      try {
        const response = await fetch(apiURL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(produtosColetados)
        });

        if (response.ok) {
          alert(" Sucesso! Produtos enviados para o Cartaz Fácil.");
          produtosColetados = [];
          atualizarListaVisual();
        } else {
          alert(" Erro ao enviar para a API (Status: " + response.status + ")");
        }
      } catch (error) {
        alert(" Erro de conexão com o servidor.");
      }
    }
  </script>
</body>
</html>

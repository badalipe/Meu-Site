<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta Cartaz Fácil - Leitor de Código de Barras</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      text-align: center;
    }
    .card {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      margin-top: 20px;
    }
    input {
      padding: 10px;
      font-size: 16px;
      width: 70%;
      margin-bottom: 10px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #0070f3;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:hover {
      background-color: #0051a2;
    }
    .preco {
      font-size: 28px;
      color: #27ae60;
      font-weight: bold;
    }
    .status {
      margin-top: 10px;
      font-style: italic;
      color: #555;
    }
  </style>
</head>
<body>

  <h1>Consulta de Produto</h1>
  <p>Escaneie ou introduza o código de barras abaixo:</p>

  <div>
    <input type="text" id="codigoBarras" placeholder="Ex: 7891234567890" autofocus />
    <button onclick="dispararBusca()">Buscar</button>
  </div>

  <div id="status" class="status"></div>

  <div class="card" id="cartaz" style="display: none;">
    <h2 id="nomeProduto">Nome do Produto</h2>
    <p class="preco" id="precoProduto">R$ 0,00</p>
    <p id="detalhesProduto"></p>
  </div>

  <script>
    const WORKER_URL = "https://flat-dawn-6511.clientetrabalho2018.workers.dev/";

    async function buscarProdutoCartazFacil(codigoDeBarras) {
      const statusElement = document.getElementById("status");
      const cartazElement = document.getElementById("cartaz");

      if (!codigoDeBarras) {
        statusElement.innerText = "Por favor, introduza um código de barras válido.";
        return;
      }

      statusElement.innerText = "A consultar produto no Cartaz Fácil...";
      cartazElement.style.display = "none";

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ ean: codigoDeBarras })
        });

        if (!response.ok) {
          throw new Error(`Erro na API: ${response.status}`);
        }

        const produto = await response.json();
        console.log("Dados recebidos:", produto);

        // Atualiza a interface com as informações recebidas
        document.getElementById("nomeProduto").innerText = produto.nome || produto.description || "Produto sem nome";
        document.getElementById("precoProduto").innerText = produto.preco ? `R$ ${produto.preco}` : "Preço não informado";
        document.getElementById("detalhesProduto").innerText = produto.detalhes || produto.brand || "";

        statusElement.innerText = "Produto encontrado!";
        cartazElement.style.display = "block";

      } catch (error) {
        console.error("Falha ao buscar informações:", error);
        statusElement.innerText = "Erro ao consultar o produto. Verifique a consola do navegador.";
      }
    }

    function dispararBusca() {
      const input = document.getElementById("codigoBarras");
      buscarProdutoCartazFacil(input.value.trim());
    }

    // Permite pressionar "Enter" no leitor de código de barras físico/teclado
    document.getElementById("codigoBarras").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        dispararBusca();
      }
    });
  </script>
</body>
</html>

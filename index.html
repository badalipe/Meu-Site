<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cartaz de Oferta</title>
  <style>
    /* Configuração para Impressão A4 */
    @page {
      size: A4 portrait;
      margin: 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      width: 210mm;
      height: 297mm;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      margin: 0 auto;
      overflow: hidden;
    }

    /* Topo: Dobra */
    .dobra {
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      color: #000;
      padding-top: 15px;
      letter-spacing: 1px;
    }

    /* Cabeçalho "OFERTA!" */
    .banner-oferta {
      position: relative;
      background-color: #e31b23;
      color: #ffeb3b;
      text-align: center;
      padding: 20px 0 25px 0;
      margin-top: 10px;
      clip-path: ellipse(80% 100% at 50% 0%);
    }

    .banner-oferta h1 {
      font-size: 55px;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      text-shadow: 2px 2px 0px #000;
      border-bottom: 4px solid #ffeb3b;
      display: inline-block;
      line-height: 1;
      padding-bottom: 5px;
    }

    /* Nome do Produto */
    .produto-nome {
      text-align: center;
      font-size: 22px;
      font-weight: 900;
      color: #000;
      margin-top: 25px;
      padding: 0 20px;
      text-transform: uppercase;
    }

    /* Área do Preço e Mancha Pincelada */
    .preco-container {
      position: relative;
      width: 90%;
      margin: 20px auto;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Mancha Amarela com Efeito Pincelada em SVG */
    .mancha-pincelada {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffeb3b;
      /* Efeito de borda irregular de pincel */
      mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200"><path fill="%23000" d="M10,25 C50,5 120,35 200,10 C280,-15 380,20 480,15 C495,30 500,70 490,120 C480,170 450,185 380,190 C300,195 180,175 100,190 C30,205 5,160 10,120 C15,80 0,45 10,25 Z"/></svg>');
      -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200"><path fill="%23000" d="M10,25 C50,5 120,35 200,10 C280,-15 380,20 480,15 C495,30 500,70 490,120 C480,170 450,185 380,190 C300,195 180,175 100,190 C30,205 5,160 10,120 C15,80 0,45 10,25 Z"/></svg>');
      mask-size: 100% 100%;
      -webkit-mask-size: 100% 100%;
      z-index: 1;
    }

    /* Unidade R$ UN */
    .unidade {
      position: absolute;
      left: 25px;
      top: 35px;
      font-size: 16px;
      font-weight: bold;
      color: #000;
      line-height: 1.1;
      z-index: 2;
      text-align: left;
    }

    /* Valor do Preço */
    .preco-valor {
      position: relative;
      z-index: 2;
      font-size: 110px;
      font-weight: 900;
      color: #000;
      letter-spacing: -3px;
    }

    /* Rodapé em 3 colunas */
    .rodape {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 30px 20px 30px;
      font-size: 10px;
      font-weight: bold;
      color: #333;
    }

    .rodape .logo {
      font-size: 16px;
      font-weight: 900;
      color: #0056b3;
    }

    .rodape .logo span {
      color: #e31b23;
    }
  </style>
</head>
<body>

  <div>
    <div class="dobra">DOBRE AQUI</div>
    
    <div class="banner-oferta">
      <h1>OFERTA!</h1>
    </div>

    <div class="produto-nome">
      REFRI FANTA PET 2L LARANJA
    </div>

    <div class="preco-container">
      <div class="mancha-pincelada"></div>
      <div class="unidade">R$<br>UN</div>
      <div class="preco-valor">9,39</div>
    </div>
  </div>

  <div class="rodape">
    <div>CÓD. PRODUTO: 7894900031515</div>
    <div class="logo">Rede <span>market</span></div>
    <div>OFERTA VÁLIDA DE 19/09/2026 ATÉ 19/09/2026</div>
  </div>

</body>
</html>
